<!DOCTYPE html>
<html lang="en">
<head>
  <title>HyperTask Miner</title>
  <meta charset="UTF-8">

  <!-- FULL SCREEN MOBILE FIX -->
  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
    }

    h2 {
      font-size: 24px;
    }

    h3 {
      font-size: 20px;
    }

    button {
      width: 90%;
      max-width: 360px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .join {
      background: #22c55e;
      color: #000;
    }

    .start {
      background: #facc15;
      color: #000;
    }

    .mine {
      background: #38bdf8;
      color: #000;
    }
  </style>
</head>

<body>
  <div class="app">
    <h2>⛏️ HyperTask Miner</h2>

    <p>🎁 Join Bonus: <b>1000 Coins</b></p>

    <a href="https://t.me/HyperTaskOfficial" target="_blank" style="width:100%">
      <button class="join">📢 Join Channel</button>
    </a>

    <button class="start" onclick="startGame()">✅ I Joined – Start</button>

    <h3>🪙 Coins: <span id="coins">0</span></h3>

    <button class="mine" onclick="mine()">⛏️ Mine</button>
  </div>

<script>
  let coins = 0;

  function startGame() {
    coins += 1000;
    document.getElementById("coins").innerText = coins;
    alert("🎉 1000 coins added!");
  }

  function mine() {
    coins += 1;
    document.getElementById("coins").innerText = coins;
  }

  // Telegram full screen request
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.expand();
  }
</script>

</body>
</html>
